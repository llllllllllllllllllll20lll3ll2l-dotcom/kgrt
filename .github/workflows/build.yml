name: build
on: [pull_request, push]

permissions:
  contents: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: |
          set -o pipefail
          ./gradlew build --max-workers=2 2>&1 | tee build.log || (sleep 15 && ./gradlew build --max-workers=2 2>&1 | tee build.log)
      - name: report build error
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f build.log ]; then
            echo '```' > err.txt
            tail -n 140 build.log >> err.txt
            echo '```' >> err.txt
            gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@err.txt
          fi
      - name: publish single mod jar to branch dist
        if: success() && github.event_name == 'push'
        run: |
          mkdir -p dist
          rm -f dist/*.jar
          JAR_FILE=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)
          JAR_NAME=$(basename "$JAR_FILE")
          cp "$JAR_FILE" "dist/$JAR_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist/
          if ! git diff --cached --quiet; then
            git commit -m "Build $JAR_NAME [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
      - name: publish github release
        if: success() && github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR_FILE=$(find dist -maxdepth 1 -type f -name '*.jar' | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            JAR_FILE=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)
          fi
          cat << 'EOF' > /tmp/release_notes.md
          ## Manyl_mod V3 (v3.0.0 — Fabric 1.21.11)

          ### Основные изменения V3
          - **Название и версия обновлены до Manyl_mod V3 (`3.0.0`)**.
          - **Новое поколение 3D-скульптуры Воительницы (60 частей, 791 элемент, `4096×4096` PBR-текстуры)**:
            - Реалистичная анатомия женщины-андроида: 12-слойный таз «песочные часы», 9-слойный плавный переход бёдер, контурные грудные чашечки с тонкими лямками, отдельные плечи, локти, запястья с пальцами, бёдра, колени, голени и каблуки.
            - Живая мимика лица: настоящее моргание веками, артикуляция губ при разговоре, полуприкрытые глазки, румянец, розово-светящиеся глаза и длинная коса до талии.
            - Съёмная многослойная серебристо-сапфировая броня с крылышками на шлеме и симметричными многоперьевыми крыльями.
          - **Живые 3D-анимации и плавное переодевание**:
            - **11 интерактивных и эмоциональных поз в диалоге и бою**: Погладить, Обнять ♥, Поцеловать ♥, Воздушный поцелуй 💋, За ручку 🤝, Танец ♪, Честь ⚔, Смущение, Пощёчина ревности, Поклон, Свадьба 💍.
            - **Плавное снятие и надевание брони при купании**: Воительница не переодевается мгновенно во время купания, а по завершении отдыха плавно надевает броню обратно.
          - **Компактный экран диалога Воительницы (`316×218`)** с вкладками «Общение и забота» и «Анимации ♥», полосами близости и ревности.
          - Сохранены все механики: Страж-Воин (`141` элемент, 4K), ранги, 4 слота брони + щит, Кольцо Обета, Древние руины, тактические клавиши `G`/`H`, русская и английская локализация.
          EOF
          sed -i 's/^          //' /tmp/release_notes.md
          if gh release view V3 >/dev/null 2>&1; then
            gh release edit V3 --title "Manyl_mod V3" --notes-file /tmp/release_notes.md --latest
            gh release upload V3 "$JAR_FILE" --clobber
          else
            gh release create V3 "$JAR_FILE" \
              --target "${{ github.sha }}" \
              --title "Manyl_mod V3" \
              --latest \
              --notes-file /tmp/release_notes.md
          fi
