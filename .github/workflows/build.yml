name: build
on: [pull_request, push]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: |
          set -o pipefail
          ./gradlew build 2>&1 | tee build.log
      - name: report build error
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f build.log ]; then
            echo '```' > err.txt
            grep -E "error:|symbol:|location:|Execution failed|FAILED|Exception" -A 3 -B 1 build.log | head -n 140 >> err.txt || tail -n 120 build.log >> err.txt
            echo '```' >> err.txt
            gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@err.txt
          fi
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
